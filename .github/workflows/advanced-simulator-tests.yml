name: advanced-simulator-tests

on:
  push:
    paths: ["akim_sim/**", "tests/**", "requirements-dev.txt", "requirements.txt", "main.py", "README.md", ".github/workflows/advanced-simulator-tests.yml"]
  pull_request:
    paths: ["akim_sim/**", "tests/**", "requirements-dev.txt", "requirements.txt", "main.py", "README.md", ".github/workflows/advanced-simulator-tests.yml"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
